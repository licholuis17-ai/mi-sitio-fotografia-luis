<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería | LUZ Fotografía</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            padding: 100px 30px;
            text-align: center;
            background:
                linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
                url("https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=2000&q=80");
            background-size: cover;
            background-position: center;
        }

        header h1 {
            font-size: 55px;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        header p {
            color: #bbb;
            letter-spacing: 2px;
        }

        nav {
            text-align: center;
            padding: 25px;
            border-bottom: 1px solid #333;
        }

        nav a {
            color: white;
            text-decoration: none;
            border: 1px solid #777;
            padding: 12px 25px;
            border-radius: 30px;
            transition: .3s;
        }

        nav a:hover {
            background: white;
            color: black;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 70px 30px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .foto {
            height: 350px;
            overflow: hidden;
            border-radius: 10px;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .5s;
        }

        .foto:hover img {
            transform: scale(1.08);
        }

        .info {
            text-align: center;
            margin-bottom: 50px;
        }

        .info h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .info p {
            color: #999;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #292929;
            color: #777;
        }

        @media (max-width: 800px) {
            .galeria {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

    <header>

        <h1>GALERÍA</h1>

        <p>Una mirada a nuestro trabajo</p>

    </header>

    <nav>

        <a href="https://tusitio.com/index.html">
            ← Volver al inicio
        </a>

    </nav>

    <main>

        <section class="info">

            <h2>Momentos reales</h2>

            <p>
                Cada fotografía busca transmitir una historia,
                una emoción o un instante que vale la pena conservar.
            </p>

        </section>

        <section class="galeria">

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80">
            </div>

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80">
            </div>

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=900&q=80">
            </div>

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80">
            </div>

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=80">
            </div>

            <div class="foto">
                <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=900&q=80">
            </div>

        </section>

    </main>

    <footer>

        © 2026 LUZ Fotografía

    </footer>

</body>

</html>
